<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Angela Cashay · 3D Gallery</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400&display=swap');

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root{
      --bg:#060608;
      --surface:#0c0c10;
      --border:rgba(255,255,255,0.055);
      --accent:#c9a96e;
      --accent-dim:rgba(201,169,110,0.1);
      --accent-mid:rgba(201,169,110,0.28);
      --text:rgba(255,255,255,0.84);
      --text-dim:rgba(255,255,255,0.3);
      --text-muted:rgba(255,255,255,0.15);
    }

    html{scroll-behavior:smooth}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Jost',sans-serif;
      font-weight:300;
      min-height:100vh;
      overflow-x:hidden;
    }

    /* Grain overlay */
    body::before{
      content:'';
      position:fixed;inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events:none;z-index:1000;opacity:0.4;
    }

    /* Nav */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:100;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 40px;height:56px;
      border-bottom:1px solid var(--border);
      background:rgba(6,6,8,0.92);
      backdrop-filter:blur(12px);
    }

    .nav-brand{
      font-family:'Cormorant Garamond',serif;
      font-weight:300;font-size:15px;
      letter-spacing:0.26em;text-transform:uppercase;
      color:var(--accent);text-decoration:none;
    }
    .nav-brand em{
      font-style:italic;color:var(--text-dim);
      font-size:11px;letter-spacing:0.14em;margin-left:10px;
    }

    .nav-links{display:flex;gap:28px;align-items:center}
    .nav-link{
      font-size:9px;letter-spacing:0.22em;text-transform:uppercase;
      color:var(--text-dim);text-decoration:none;
      transition:color 0.2s;
    }
    .nav-link:hover{color:var(--accent)}
    .nav-link.active{color:var(--accent)}

    /* Hero */
    #hero{
      padding-top:56px;
      height:100vh;
      display:grid;
      grid-template-rows:1fr auto;
      position:relative;
      overflow:hidden;
    }

    #hero-viewer{
      width:100%;height:100%;
      border:none;display:block;
    }

    .hero-overlay{
      position:absolute;
      bottom:0;left:0;right:0;
      padding:48px 40px 40px;
      background:linear-gradient(to top,rgba(6,6,8,0.96) 0%,rgba(6,6,8,0.6) 60%,transparent 100%);
      display:flex;align-items:flex-end;justify-content:space-between;
    }

    .hero-meta{}
    .hero-label{
      font-size:8px;letter-spacing:0.32em;text-transform:uppercase;
      color:var(--accent);opacity:0.7;margin-bottom:10px;
    }
    .hero-title{
      font-family:'Cormorant Garamond',serif;
      font-size:clamp(28px,5vw,56px);
      font-weight:300;line-height:1.1;
      letter-spacing:0.02em;
      color:rgba(255,255,255,0.92);
      margin-bottom:10px;
    }
    .hero-scripture{
      font-family:'Cormorant Garamond',serif;
      font-style:italic;font-size:15px;font-weight:300;
      color:rgba(255,255,255,0.45);
      letter-spacing:0.04em;
      max-width:480px;
      line-height:1.6;
    }
    .hero-ref{
      font-size:9px;letter-spacing:0.22em;text-transform:uppercase;
      color:var(--accent);opacity:0.6;margin-top:8px;
    }

    .hero-actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
    .hero-btn{
      display:inline-flex;align-items:center;gap:8px;
      background:transparent;
      border:1px solid var(--accent-mid);
      color:var(--accent);
      font-family:'Jost',sans-serif;font-size:9px;font-weight:300;
      letter-spacing:0.22em;text-transform:uppercase;
      padding:10px 22px;border-radius:2px;
      cursor:pointer;text-decoration:none;
      transition:all 0.22s;
    }
    .hero-btn:hover{background:var(--accent-dim);border-color:rgba(201,169,110,0.5)}
    .hero-btn.primary{
      background:rgba(201,169,110,0.08);
    }

    .scroll-hint{
      position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
      display:flex;flex-direction:column;align-items:center;gap:6px;
      opacity:0;animation:fadeInUp 1s 2s forwards;
    }
    .scroll-hint span{
      font-size:8px;letter-spacing:0.28em;text-transform:uppercase;
      color:var(--text-muted);
    }
    .scroll-line{
      width:1px;height:32px;
      background:linear-gradient(to bottom,var(--accent-mid),transparent);
      animation:scrollPulse 2s ease-in-out infinite;
    }
    @keyframes scrollPulse{0%,100%{opacity:0.3;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.1)}}
    @keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    /* Gallery section */
    #gallery{
      padding:80px 40px 120px;
      max-width:1400px;margin:0 auto;
    }

    .section-header{
      display:flex;align-items:baseline;justify-content:space-between;
      margin-bottom:48px;
      padding-bottom:16px;
      border-bottom:1px solid var(--border);
    }

    .section-title{
      font-family:'Cormorant Garamond',serif;
      font-size:11px;font-weight:300;
      letter-spacing:0.32em;text-transform:uppercase;
      color:var(--accent);opacity:0.7;
    }

    .section-count{
      font-size:9px;letter-spacing:0.18em;
      color:var(--text-muted);
    }

    /* Grid */
    .works-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
      gap:2px;
    }

    /* Card */
    .work-card{
      position:relative;
      background:var(--surface);
      cursor:pointer;
      overflow:hidden;
      aspect-ratio:4/5;
      transition:transform 0.3s ease;
    }

    .work-card::after{
      content:'';
      position:absolute;inset:0;
      border:1px solid transparent;
      transition:border-color 0.3s;
      pointer-events:none;
      z-index:5;
    }
    .work-card:hover::after{border-color:var(--accent-mid)}
    .work-card:hover{transform:scale(1.005)}

    .card-viewer{
      width:100%;height:100%;
      border:none;display:block;
      pointer-events:none;
    }

    .card-overlay{
      position:absolute;
      bottom:0;left:0;right:0;
      padding:28px 20px 20px;
      background:linear-gradient(to top,rgba(6,6,8,0.95) 0%,rgba(6,6,8,0.4) 70%,transparent 100%);
      transition:opacity 0.3s;
      z-index:4;
    }

    .card-title{
      font-family:'Cormorant Garamond',serif;
      font-size:18px;font-weight:300;
      letter-spacing:0.06em;
      color:rgba(255,255,255,0.9);
      margin-bottom:4px;
    }
    .card-ref{
      font-size:8px;letter-spacing:0.22em;text-transform:uppercase;
      color:var(--accent);opacity:0.65;
      margin-bottom:8px;
    }
    .card-scripture{
      font-family:'Cormorant Garamond',serif;
      font-style:italic;font-size:11px;
      color:rgba(255,255,255,0.35);
      line-height:1.5;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .card-open{
      position:absolute;top:16px;right:16px;
      width:32px;height:32px;
      background:rgba(6,6,8,0.7);
      border:1px solid var(--border);
      border-radius:2px;
      display:flex;align-items:center;justify-content:center;
      opacity:0;transition:opacity 0.2s;
      z-index:5;
      color:var(--text-dim);
      font-size:12px;
    }
    .work-card:hover .card-open{opacity:1}

    /* Loader state for cards */
    .card-loading{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      background:var(--surface);
      z-index:3;transition:opacity 0.5s;
    }
    .card-loading.done{opacity:0;pointer-events:none}
    .mini-ring{
      width:20px;height:20px;border-radius:50%;
      border:1px solid rgba(201,169,110,0.15);
      border-top-color:var(--accent);
      animation:spin 0.9s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Empty state */
    .empty-state{
      grid-column:1/-1;
      padding:80px 0;
      text-align:center;
    }
    .empty-state p{
      font-family:'Cormorant Garamond',serif;
      font-size:20px;font-weight:300;
      letter-spacing:0.08em;
      color:var(--text-dim);
      margin-bottom:8px;
    }
    .empty-state span{
      font-size:9px;letter-spacing:0.22em;text-transform:uppercase;
      color:var(--text-muted);
    }

    /* Footer */
    footer{
      border-top:1px solid var(--border);
      padding:32px 40px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .footer-brand{
      font-family:'Cormorant Garamond',serif;
      font-size:12px;font-weight:300;
      letter-spacing:0.22em;text-transform:uppercase;
      color:var(--accent);opacity:0.5;
    }
    .footer-copy{
      font-size:9px;letter-spacing:0.16em;
      color:var(--text-muted);
    }

    /* Full viewer modal */
    #modal{
      position:fixed;inset:0;z-index:500;
      background:var(--bg);
      opacity:0;pointer-events:none;
      transition:opacity 0.35s ease;
      display:flex;flex-direction:column;
    }
    #modal.open{opacity:1;pointer-events:all}

    .modal-bar{
      height:48px;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 24px;
      border-bottom:1px solid var(--border);
      background:rgba(6,6,8,0.97);
      flex-shrink:0;
    }

    .modal-title{
      font-family:'Cormorant Garamond',serif;
      font-size:13px;font-weight:300;letter-spacing:0.22em;text-transform:uppercase;
      color:var(--text-dim);
    }
    .modal-title strong{color:var(--accent);font-weight:300}

    .modal-actions{display:flex;gap:8px}
    .modal-btn{
      background:transparent;
      border:1px solid var(--border);
      color:var(--text-dim);
      font-family:'Jost',sans-serif;font-size:9px;font-weight:300;
      letter-spacing:0.18em;text-transform:uppercase;
      padding:5px 14px;border-radius:2px;cursor:pointer;
      transition:all 0.18s;text-decoration:none;
      display:inline-flex;align-items:center;gap:6px;
    }
    .modal-btn:hover{border-color:var(--accent-mid);color:var(--accent);background:var(--accent-dim)}

    #modal-viewer{
      flex:1;width:100%;border:none;display:block;
    }

    /* Page fade in */
    .fade-in{
      opacity:0;transform:translateY(16px);
      animation:fadeUp 0.7s ease forwards;
    }
    @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

    .stagger-1{animation-delay:0.1s}
    .stagger-2{animation-delay:0.2s}
    .stagger-3{animation-delay:0.3s}

    @media(max-width:768px){
      nav{padding:0 20px}
      .hero-overlay{padding:32px 20px 28px;flex-direction:column;gap:20px}
      .hero-actions{align-items:flex-start}
      #gallery{padding:60px 16px 80px}
      .works-grid{grid-template-columns:1fr 1fr;gap:2px}
      footer{flex-direction:column;gap:12px;text-align:center}
    }
    @media(max-width:480px){
      .works-grid{grid-template-columns:1fr;gap:2px}
    }
  </style>
</head>
<body>

<nav>
  <a href="https://www.angelacashay.com" class="nav-brand">Angela Cashay <em>· Creative Faith</em></a>
  <div class="nav-links">
    <a href="https://www.angelacashay.com" class="nav-link">Home</a>
    <a href="#gallery" class="nav-link">Works</a>
    <a href="https://www.angelacashay.com" class="nav-link">Contact</a>
  </div>
</nav>

<!-- Hero -->
<section id="hero">
  <iframe id="hero-viewer" src="" allowfullscreen></iframe>
  <div class="hero-overlay">
    <div class="hero-meta">
      <div class="hero-label">Featured Work</div>
      <div class="hero-title" id="hero-title">—</div>
      <div class="hero-scripture" id="hero-scripture"></div>
      <div class="hero-ref" id="hero-ref"></div>
    </div>
    <div class="hero-actions">
      <button class="hero-btn primary" id="hero-open">
        <span>↗</span> Open Full View
      </button>
      <a href="#gallery" class="hero-btn">View All Works</a>
    </div>
  </div>
  <div class="scroll-hint">
    <span>Scroll</span>
    <div class="scroll-line"></div>
  </div>
</section>

<!-- Gallery -->
<section id="gallery">
  <div class="section-header fade-in stagger-1">
    <span class="section-title">Works</span>
    <span class="section-count" id="work-count"></span>
  </div>
  <div class="works-grid fade-in stagger-2" id="grid"></div>
</section>

<footer>
  <div class="footer-brand">Angela Cashay · Keep Creating · Creative Faith</div>
  <div class="footer-copy">© <span id="yr"></span> Angela Cashay. All rights reserved.</div>
</footer>

<!-- Full viewer modal -->
<div id="modal">
  <div class="modal-bar">
    <div class="modal-title">Viewing: <strong id="modal-title-text">—</strong></div>
    <div class="modal-actions">
      <a href="#" id="modal-share" class="modal-btn">⬡ Share</a>
      <button class="modal-btn" id="modal-close">✕ Close</button>
    </div>
  </div>
  <iframe id="modal-viewer" src="" allowfullscreen></iframe>
</div>

<script>
const VIEWER_BASE = 'https://angelacashay.github.io/AC-3D-Viewer/viewer.html';
const GALLERY_JSON = 'https://raw.githubusercontent.com/AngelaCashay/AC-3D-Viewer/main/gallery.json';
const MODEL_BASE = 'https://pub-3e7d870fab6147e5814d59675bd67072.r2.dev/';

document.getElementById('yr').textContent = new Date().getFullYear();

let works = [];
let featuredWork = null;

// Build viewer URL from work
function viewerURL(work, kiosk=false) {
  const base = `${VIEWER_BASE}?model=${encodeURIComponent(work.model)}&${work.shareParams}`;
  return kiosk ? base + '&rotate=1&rs=0.003' : base;
}

// Load gallery data
async function loadGallery() {
  try {
    const res = await fetch(GALLERY_JSON + '?t=' + Date.now());
    const data = await res.json();
    works = data.works || [];
    featuredWork = works.find(w => w.featured) || works[0];
    renderHero();
    renderGrid();
    document.getElementById('work-count').textContent =
      works.length + (works.length === 1 ? ' work' : ' works');
  } catch(e) {
    console.error('Could not load gallery.json:', e);
    renderEmpty();
  }
}

// Hero
function renderHero() {
  if(!featuredWork) return;
  document.getElementById('hero-title').textContent = featuredWork.title;
  document.getElementById('hero-scripture').textContent = featuredWork.scripture || '';
  document.getElementById('hero-ref').textContent = featuredWork.reference || '';
  // Hero uses kiosk mode — auto rotate, no controls
  document.getElementById('hero-viewer').src = viewerURL(featuredWork, true);
  document.getElementById('hero-open').onclick = () => openModal(featuredWork);
  document.title = `${featuredWork.title} · Angela Cashay`;
}

// Grid
function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if(!works.length) { renderEmpty(); return; }

  works.forEach((work, i) => {
    const card = document.createElement('div');
    card.className = 'work-card';
    card.style.animationDelay = (0.05 * i) + 's';

    card.innerHTML = `
      <div class="card-loading" id="loading-${i}">
        <div class="mini-ring"></div>
      </div>
      <iframe
        class="card-viewer"
        src="${viewerURL(work, true)}"
        loading="lazy"
        title="${work.title}"
        onload="document.getElementById('loading-${i}').classList.add('done')"
      ></iframe>
      <div class="card-overlay">
        <div class="card-ref">${work.reference || ''}</div>
        <div class="card-title">${work.title}</div>
        <div class="card-scripture">${work.scripture || ''}</div>
      </div>
      <div class="card-open">↗</div>
    `;

    card.addEventListener('click', () => openModal(work));
    grid.appendChild(card);
  });
}

function renderEmpty() {
  document.getElementById('grid').innerHTML = `
    <div class="empty-state">
      <p>Works coming soon</p>
      <span>Add entries to gallery.json to display here</span>
    </div>
  `;
}

// Modal
function openModal(work) {
  const modal = document.getElementById('modal');
  document.getElementById('modal-title-text').textContent = work.title;
  document.getElementById('modal-viewer').src = viewerURL(work, false);
  document.getElementById('modal-share').href = viewerURL(work, false);
  document.getElementById('modal-share').target = '_blank';
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.remove('open');
  document.getElementById('modal-viewer').src = '';
  document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

// Load
loadGallery();
</script>
</body>
</html>
