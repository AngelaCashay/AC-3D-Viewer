<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Angela Cashay · 3D</title>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@7.0.0/babylon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.0.0/babylonjs.loaders.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ac:#c9a96e;--acm:rgba(201,169,110,0.3)}
    html,body{width:100%;height:100%;background:#080808;overflow:hidden}
    #app{width:100vw;height:100vh;position:relative}
    #rc{width:100%;height:100%;display:block;touch-action:none}
    #wm{position:absolute;bottom:18px;left:20px;z-index:10;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:rgba(201,169,110,0.4);pointer-events:none;user-select:none}
    #bCV{position:absolute;bottom:16px;right:20px;z-index:10;background:rgba(8,8,8,0.7);border:1px solid var(--acm);color:var(--ac);font-family:'Jost',sans-serif;font-size:9px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;padding:7px 14px;border-radius:2px;cursor:pointer;transition:all .2s;opacity:0;pointer-events:none}
    #bCV.v{opacity:1;pointer-events:all}
    #bCV:hover{background:rgba(201,169,110,0.12)}
    #ld{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080808;transition:opacity .5s}
    #ld.h{opacity:0;pointer-events:none}
    .lr{width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,169,110,0.15);border-top-color:var(--ac);animation:spin .9s linear infinite;margin-bottom:16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .lt{font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,0.3)}
    #np{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none}
    #np.v{opacity:1}
    .nt{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:.1em;color:rgba(255,255,255,0.5);margin-bottom:10px}
    .ns{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,0.2)}
  </style>
</head>
<body>
<div id="app">
  <canvas id="rc"></canvas>
  <div id="wm">Angela Cashay</div>
  <button id="bCV">↩ Creator View</button>
  <div id="ld"><div class="lr"></div><div class="lt">Loading…</div></div>
  <div id="np"><div class="nt">No scene loaded</div><div class="ns">Open via a share link from the editor</div></div>
</div>
<script>
const MODEL_BASE='https://raw.githubusercontent.com/AngelaCashay/AC-3D-Viewer/main/models/';
const canvas=document.getElementById('rc');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
let scene,cam,glow,pipe,hemi,dir,fill,fill2,savedCam=null;

const G=id=>document.getElementById(id);
const h2c=hex=>new BABYLON.Color3(parseInt(hex.slice(1,3),16)/255,parseInt(hex.slice(3,5),16)/255,parseInt(hex.slice(5,7),16)/255);

function createScene(p) {
  scene=new BABYLON.Scene(engine);
  const bg='#'+(p.get('bg')||'080808');
  const c=h2c(bg); scene.clearColor=new BABYLON.Color4(c.r,c.g,c.b,1);

  // Build camera with saved position from the start — never auto-frame
  const alpha=parseFloat(p.get('ca')||(-Math.PI/2));
  const beta=parseFloat(p.get('cb')||(Math.PI/3));
  const radius=parseFloat(p.get('cr')||4);
  const tx=parseFloat(p.get('camTX')||0);
  const ty=parseFloat(p.get('camTY')||0);
  const tz=parseFloat(p.get('camTZ')||0);
  cam=new BABYLON.ArcRotateCamera('c',alpha,beta,radius,new BABYLON.Vector3(tx,ty,tz),scene);
  cam.attachControl(canvas,true);
  cam.lowerRadiusLimit=0.1; cam.upperRadiusLimit=100; cam.wheelDeltaPercentage=0.01; cam.minZ=0.001;
  cam.fov=parseFloat(p.get('fov')||0.8);

  // Save creator view
  savedCam={alpha,beta,radius,target:new BABYLON.Vector3(tx,ty,tz)};
  if(p.has('ca')) G('bCV').classList.add('v');

  hemi=new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0,1,0),scene);
  hemi.intensity=parseFloat(p.get('ambInt')||0.4);
  hemi.diffuse=h2c('#'+(p.get('ambCol')||'e6d9ff'));
  hemi.groundColor=h2c('#'+(p.get('gr')||'1a1412'));

  dir=new BABYLON.DirectionalLight('d',new BABYLON.Vector3(parseFloat(p.get('keyX')||-1),parseFloat(p.get('keyY')||-2),parseFloat(p.get('keyZ')||-1)),scene);
  dir.intensity=parseFloat(p.get('keyInt')||0.8);
  dir.diffuse=h2c('#'+(p.get('keyCol')||'fff4d9'));
  dir.specular=p.get('sp')==='0'?new BABYLON.Color3(0,0,0):new BABYLON.Color3(1,1,1);

  fill=new BABYLON.PointLight('f',new BABYLON.Vector3(parseFloat(p.get('fillX')||2),parseFloat(p.get('fillY')||1),parseFloat(p.get('fillZ')||2)),scene);
  fill.intensity=parseFloat(p.get('fillInt')||0.3);
  fill.diffuse=h2c('#'+(p.get('fillCol')||'99b3ff'));

  fill2=new BABYLON.PointLight('f2',new BABYLON.Vector3(parseFloat(p.get('fill2X')||-2),parseFloat(p.get('fill2Y')||2),parseFloat(p.get('fill2Z')||-2)),scene);
  fill2.intensity=p.get('f2')==='1'?parseFloat(p.get('fill2Int')||0.2):0;
  fill2.diffuse=h2c('#'+(p.get('fill2Col')||'ffccaa'));

  glow=new BABYLON.GlowLayer('g',scene);
  const gOn=p.get('glowOn')!=='0';
  glow.intensity=gOn?parseFloat(p.get('glowInt')||0.6):0;
  glow.blurKernelSize=parseFloat(p.get('glowBlur')||32);

  pipe=new BABYLON.DefaultRenderingPipeline('p',true,scene,[cam]);
  pipe.bloomEnabled=p.get('bloom')==='1';
  pipe.bloomIntensity=parseFloat(p.get('bloomInt')||0.5);
  pipe.bloomThreshold=parseFloat(p.get('bloomThresh')||0.3);
  pipe.bloomKernel=parseFloat(p.get('bloomKernel')||64);
  pipe.depthOfFieldEnabled=p.get('dof')==='1';
  try{pipe.depthOfField.focusDistance=parseFloat(p.get('dofDist')||10)*1000;pipe.depthOfField.fStop=parseFloat(p.get('dofAp')||0.05);pipe.depthOfField.focalLength=parseFloat(p.get('dofFocal')||50);}catch(e){}
  pipe.imageProcessingEnabled=true;
  pipe.imageProcessing.exposure=parseFloat(p.get('ex')||1);
  pipe.imageProcessing.contrast=parseFloat(p.get('co')||1);
  pipe.imageProcessing.vignetteEnabled=p.get('vig')==='1';
  pipe.imageProcessing.vignetteWeight=parseFloat(p.get('vigInt')||0.5)*4;
  const vgC=h2c('#'+(p.get('vigCol')||'000000'));
  pipe.imageProcessing.vignetteColor=new BABYLON.Color4(vgC.r,vgC.g,vgC.b,1);

  // Grain
  pipe.grainEnabled=true; pipe.grain.intensity=10; pipe.grain.animated=true; pipe.grainEnabled=p.get('grain')==='1';
  if(pipe.grainEnabled) pipe.grain.intensity=parseFloat(p.get('grainInt')||0.2)*50;

  // Chromatic
  const ch=parseFloat(p.get('ch')||0);
  pipe.chromaticAberrationEnabled=true; pipe.chromaticAberration.aberrationAmount=0; pipe.chromaticAberrationEnabled=ch>0;
  if(ch>0) pipe.chromaticAberration.aberrationAmount=ch*10;

  // Sharpen
  const sh=parseFloat(p.get('sh')||0);
  pipe.sharpenEnabled=true; pipe.sharpen.edgeAmount=0; pipe.sharpenEnabled=sh>0;
  if(sh>0) pipe.sharpen.edgeAmount=sh;

  // Saturation
  const sa=parseFloat(p.get('sa')||1);
  if(sa!==1){
    if(!pipe.imageProcessing.colorCurves) pipe.imageProcessing.colorCurves=new BABYLON.ColorCurves();
    pipe.imageProcessing.colorCurvesEnabled=true;
    pipe.imageProcessing.colorCurves.globalSaturation=(sa-1)*100;
  }

  // Auto rotate
  const rt=p.get('rt')==='1';
  const rs=parseFloat(p.get('rs')||0.005);
  const rd=parseFloat(p.get('rd')||1);
  scene.registerBeforeRender(()=>{if(rt) cam.alpha+=rs*rd});

  scene.createDefaultEnvironment({createGround:false,createSkybox:false});
}

function restoreCreatorView(){
  if(!savedCam) return;
  cam.alpha=savedCam.alpha; cam.beta=savedCam.beta;
  cam.radius=savedCam.radius; cam.target=savedCam.target.clone();
}

function showNoParams(){
  G('ld').classList.add('h');
  G('np').classList.add('v');
}

function init(){
  const p=new URLSearchParams(window.location.search);
  if(!p.has('model')&&!p.has('bg')){showNoParams();return;}

  createScene(p);

  const model=p.get('model');
  if(!model||model==='none loaded'){showNoParams();return;}

  const url=MODEL_BASE+encodeURIComponent(model);
  BABYLON.SceneLoader.ImportMesh('','',url,scene,ms=>{
    // Apply wireframe if set
    if(p.get('wf')==='1') ms.forEach(m=>{if(m.material)m.material.wireframe=true});
    G('ld').classList.add('h');
  },null,(sc,msg)=>{
    console.error(msg);
    G('ld').classList.add('h');
    G('np').classList.add('v');
  });

  G('bCV').addEventListener('click',restoreCreatorView);
  engine.runRenderLoop(()=>scene.render());
  window.addEventListener('resize',()=>engine.resize());
}

init();
</script>
</body>
</html>
