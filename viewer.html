<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Angela Cashay · 3D</title>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@7.0.0/babylon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.0.0/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-materials@7.0.0/babylonjs.materials.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--ac:#c9a96e;--acm:rgba(201,169,110,0.3)}
    html,body{width:100%;height:100%;background:#080808;overflow:hidden}
    #app{width:100vw;height:100vh;position:relative}
    #rc{width:100%;height:100%;display:block;touch-action:none}
    #wm{position:absolute;bottom:18px;left:20px;z-index:10;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:rgba(201,169,110,0.4);pointer-events:none;user-select:none}
    #bCV{position:absolute;bottom:16px;right:20px;z-index:10;background:rgba(8,8,8,0.7);border:1px solid var(--acm);color:var(--ac);font-family:'Jost',sans-serif;font-size:9px;font-weight:300;letter-spacing:.2em;text-transform:uppercase;padding:7px 14px;border-radius:2px;cursor:pointer;transition:all .2s;opacity:0;pointer-events:none}
    #bCV.v{opacity:1;pointer-events:all}
    #bCV:hover{background:rgba(201,169,110,0.12)}
    #ld{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080808;transition:opacity .5s}
    #ld.h{opacity:0;pointer-events:none}
    .lr{width:40px;height:40px;border-radius:50%;border:1px solid rgba(201,169,110,0.15);border-top-color:var(--ac);animation:spin .9s linear infinite;margin-bottom:16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .lt{font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,0.3)}
    #np{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none}
    #np.v{opacity:1}
    .nt{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;letter-spacing:.1em;color:rgba(255,255,255,0.5);margin-bottom:10px}
    .ns{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,0.2)}
  </style>
</head>
<body>
<div id="app">
  <canvas id="rc"></canvas>
  <div id="wm">Angela Cashay</div>
  <button id="bCV">↩ Creator View</button>
  <div id="ld"><div class="lr"></div><div class="lt">Loading…</div></div>
  <div id="np"><div class="nt">No scene loaded</div><div class="ns">Open via a share link from the editor</div></div>
</div>
<script>
const MODEL_BASE='https://raw.githubusercontent.com/AngelaCashay/AC-3D-Viewer/main/models/';
const canvas=document.getElementById('rc');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
let scene,cam,glow,pipe,hemi,dir,fill,fill2,savedCam=null;

const G=id=>document.getElementById(id);
const h2c=hex=>new BABYLON.Color3(parseInt(hex.slice(1,3),16)/255,parseInt(hex.slice(3,5),16)/255,parseInt(hex.slice(5,7),16)/255);

function createScene(p) {
  // Helper: check short name first, then long name fallback
  const g=(s,l,fb)=>p.has(s)?p.get(s):p.has(l)?p.get(l):fb;
  const gf=(s,l,fb)=>parseFloat(g(s,l,String(fb)));
  const gb=(s,l)=>g(s,l,'0')==='1';

  scene=new BABYLON.Scene(engine);
  const bg='#'+(p.get('bg')||'080808');
  const c=h2c(bg); scene.clearColor=new BABYLON.Color4(c.r,c.g,c.b,1);

  // Camera — short: ca/cb/cr, long: camAlpha/camBeta/camRadius
  const rawAlpha=gf('ca','camAlpha',-Math.PI/2);
  const alpha=rawAlpha%(2*Math.PI);
  const beta=gf('cb','camBeta',Math.PI/3);
  const radius=gf('cr','camRadius',4);
  const tx=gf('ctx','camTX',0);
  const ty=gf('cty','camTY',0);
  const tz=gf('ctz','camTZ',0);
  cam=new BABYLON.ArcRotateCamera('c',alpha,beta,radius,new BABYLON.Vector3(tx,ty,tz),scene);
  cam.attachControl(canvas,true);
  cam.lowerRadiusLimit=0.1; cam.upperRadiusLimit=100; cam.wheelDeltaPercentage=0.01; cam.minZ=0.001;
  cam.fov=gf('fv','fov',0.8);
  savedCam={alpha,beta,radius,target:new BABYLON.Vector3(tx,ty,tz)};
  if(p.has('ca')||p.has('camAlpha')) G('bCV').classList.add('v');

  // Lights
  hemi=new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0,1,0),scene);
  hemi.intensity=gf('aI','ambInt',0.4);
  hemi.diffuse=h2c('#'+g('aC','ambCol','e6d9ff'));
  hemi.groundColor=h2c('#'+g('gr','groundCol','1a1412'));

  dir=new BABYLON.DirectionalLight('d',new BABYLON.Vector3(gf('kX','keyX',-1),gf('kY','keyY',-2),gf('kZ','keyZ',-1)),scene);
  dir.intensity=gf('kI','keyInt',0.8);
  dir.diffuse=h2c('#'+g('kC','keyCol','fff4d9'));
  dir.specular=g('sp','spec','1')==='0'?new BABYLON.Color3(0,0,0):new BABYLON.Color3(1,1,1);

  fill=new BABYLON.PointLight('f',new BABYLON.Vector3(gf('fX','fillX',2),gf('fY','fillY',1),gf('fZ','fillZ',2)),scene);
  fill.intensity=gf('fI','fillInt',0.3);
  fill.diffuse=h2c('#'+g('fC','fillCol','99b3ff'));

  fill2=new BABYLON.PointLight('f2',new BABYLON.Vector3(gf('f2X','fill2X',-2),gf('f2Y','fill2Y',2),gf('f2Z','fill2Z',-2)),scene);
  const f2on=gb('f2','fill2On');
  fill2.intensity=f2on?gf('f2I','fill2Int',0.2):0;
  fill2.diffuse=h2c('#'+g('f2C','fill2Col','ffccaa'));

  // Glow
  glow=new BABYLON.GlowLayer('g',scene);
  const glowOn=gb('gOn','glowOn');
  glow.intensity=glowOn?gf('gI','glowInt',0.6):0;
  glow.blurKernelSize=gf('gB','glowBlur',32);

  // Pipeline
  pipe=new BABYLON.DefaultRenderingPipeline('p',true,scene,[cam]);
  pipe.bloomEnabled=gb('blOn','bloom');
  pipe.bloomIntensity=gf('blI','bloomInt',0.5);
  pipe.bloomThreshold=gf('blT','bloomThresh',0.3);
  pipe.bloomKernel=gf('blK','bloomKernel',64);
  pipe.depthOfFieldEnabled=gb('dfOn','dof');
  try{
    pipe.depthOfField.focusDistance=gf('dfD','dofDist',10)*1000;
    pipe.depthOfField.fStop=gf('dfA','dofAp',0.05);
    pipe.depthOfField.focalLength=gf('dfL','dofFocal',50);
  }catch(e){}

  pipe.imageProcessingEnabled=true;
  pipe.imageProcessing.exposure=gf('ex','exp',1);
  pipe.imageProcessing.contrast=gf('co','contrast',1);
  pipe.imageProcessing.vignetteEnabled=gb('vgOn','vig');
  pipe.imageProcessing.vignetteWeight=gf('vgI','vigInt',0.5)*4;
  const vgC=h2c('#'+g('vgC','vigCol','000000'));
  pipe.imageProcessing.vignetteColor=new BABYLON.Color4(vgC.r,vgC.g,vgC.b,1);

  // Grain
  pipe.grainEnabled=true; pipe.grain.intensity=10; pipe.grain.animated=true;
  pipe.grainEnabled=gb('gnOn','grain');
  if(pipe.grainEnabled) pipe.grain.intensity=gf('gnI','grainInt',0.2)*50;

  // Chromatic
  const ch=gf('ch','chrom',0);
  pipe.chromaticAberrationEnabled=true; pipe.chromaticAberration.aberrationAmount=0;
  pipe.chromaticAberrationEnabled=ch>0;
  if(ch>0) pipe.chromaticAberration.aberrationAmount=ch*10;

  // Sharpen
  const sh=gf('sh','sharp',0);
  pipe.sharpenEnabled=true; pipe.sharpen.edgeAmount=0;
  pipe.sharpenEnabled=sh>0;
  if(sh>0) pipe.sharpen.edgeAmount=sh;

  // Saturation
  const sa=gf('sa','sat',1);
  if(Math.abs(sa-1)>0.01){
    if(!pipe.imageProcessing.colorCurves) pipe.imageProcessing.colorCurves=new BABYLON.ColorCurves();
    pipe.imageProcessing.colorCurvesEnabled=true;
    pipe.imageProcessing.colorCurves.globalSaturation=(sa-1)*100;
  }

  // Auto rotate
  const rt=gb('rt','rotate');
  const rs=gf('rs','rotSpd',0.005);
  const rd=gf('rd','rotDir',1);
  scene.registerBeforeRender(()=>{if(rt) cam.alpha+=rs*rd});

  // Halftone params stored for after model loads
  const htHex = g('htColor','htColor','000000');
  scene._htParams = {
    on: gb('ht','ht'),
    size: gf('htSize','htSize',4),
    angle: gf('htAngle','htAngle',0),
    contrast: gf('htContrast','htContrast',1),
    colorR: parseInt(htHex.slice(0,2),16)/255,
    colorG: parseInt(htHex.slice(2,4),16)/255,
    colorB: parseInt(htHex.slice(4,6),16)/255,
    pattern: parseInt(g('htPattern','htPattern','0')),
    colorMode: parseInt(g('htColorMode','htColorMode','0')),
    glbOnly: gb('htGlbOnly','htGlbOnly')
  };

  scene.createDefaultEnvironment({createGround:false,createSkybox:false});
}

function restoreCreatorView(){
  if(!savedCam) return;
  cam.alpha=savedCam.alpha; cam.beta=savedCam.beta;
  cam.radius=savedCam.radius; cam.target=savedCam.target.clone();
}

function showNoParams(){
  G('ld').classList.add('h');
  G('np').classList.add('v');
}

function init(){
  const p=new URLSearchParams(window.location.search);
  if(!p.has('model')&&!p.has('bg')){showNoParams();return;}

  createScene(p);

  const model=p.get('model');
  if(!model||model==='none loaded'){showNoParams();return;}

  const url=MODEL_BASE+encodeURIComponent(model);
  BABYLON.SceneLoader.ImportMesh('','',url,scene,ms=>{
    // Apply wireframe if set
    if(p.get('wf')==='1'||p.get('wire')==='1') ms.forEach(m=>{if(m.material)m.material.wireframe=true});
    // Apply emissive override if set
    const emOn=p.get('emOn')==='1';
    if(emOn){
      const emHex=p.get('emCol')||'c9a96e';
      const emR=parseInt(emHex.slice(0,2),16)/255;
      const emG=parseInt(emHex.slice(2,4),16)/255;
      const emB=parseInt(emHex.slice(4,6),16)/255;
      const emStr=parseFloat(p.get('emStr')||1);
      ms.forEach(m=>{
        try{
          if(!m.material||m.material.emissiveColor===undefined) return;
          const orig=m.material.emissiveColor;
          // Only override meshes that already have meaningful emission from Blender
          if((orig.r+orig.g+orig.b) < 0.05) return;
          m.material.emissiveColor=new BABYLON.Color3(emR*emStr,emG*emStr,emB*emStr);
        }catch(e){}
      });
    }
    // Apply halftone if enabled
    const ht=scene._htParams;
    if(ht&&ht.on){
      const htShaderSrc=`precision highp float;varying vec2 vUV;uniform sampler2D textureSampler;uniform vec2 screenSize;uniform float dotSize;uniform float angle;uniform float contrast;uniform vec3 dotColor;uniform int pattern;uniform int colorMode;vec2 rotate(vec2 p,float a){float c=cos(a);float s=sin(a);return vec2(p.x*c-p.y*s,p.x*s+p.y*c);}void main(void){vec2 px=vUV*screenSize;float rad=angle*3.14159/180.0;vec2 rotPx=rotate(px,rad);vec2 cell=floor(rotPx/dotSize);vec2 cellCenter=rotate((cell+0.5)*dotSize,-rad);vec4 color=texture2D(textureSampler,cellCenter/screenSize);float brightness=clamp((color.r+color.g+color.b)/3.0*contrast,0.0,1.0);float dist=distance(rotPx,rotate(cellCenter,rad));float alpha=0.0;if(pattern==0){float radius=dotSize*0.5*brightness;alpha=step(dist,radius);}else if(pattern==1){float linePos=mod(rotPx.y,dotSize)/dotSize;alpha=step(linePos,brightness);}else{float lx=mod(rotPx.x,dotSize)/dotSize;float ly=mod(rotPx.y,dotSize)/dotSize;float thresh=1.0-brightness;alpha=1.0-step(thresh,lx)*step(thresh,ly);}vec3 col=colorMode==1?color.rgb:dotColor;gl_FragColor=vec4(col*alpha,color.a);}`;
      const htCompSrc=`precision highp float;varying vec2 vUV;uniform sampler2D textureSampler;uniform sampler2D meshSampler;uniform vec2 screenSize;uniform float dotSize;uniform float angle;uniform float contrast;uniform vec3 dotColor;uniform int pattern;uniform int colorMode;uniform vec3 bgColor;vec2 rotate(vec2 p,float a){float c=cos(a);float s=sin(a);return vec2(p.x*c-p.y*s,p.x*s+p.y*c);}void main(void){vec4 bgSample=texture2D(textureSampler,vUV);vec4 meshSample=texture2D(meshSampler,vUV);if(meshSample.a<0.05){gl_FragColor=bgSample;return;}vec2 px=vUV*screenSize;float rad=angle*3.14159/180.0;vec2 rotPx=rotate(px,rad);vec2 cell=floor(rotPx/dotSize);vec2 cellCenter=rotate((cell+0.5)*dotSize,-rad);vec4 color=texture2D(meshSampler,cellCenter/screenSize);float brightness=clamp((color.r+color.g+color.b)/3.0*contrast,0.0,1.0);float dist=distance(rotPx,rotate(cellCenter,rad));float alpha=0.0;if(pattern==0){float radius=dotSize*0.5*brightness;alpha=step(dist,radius);}else if(pattern==1){float linePos=mod(rotPx.y,dotSize)/dotSize;alpha=step(linePos,brightness);}else{float lx=mod(rotPx.x,dotSize)/dotSize;float ly=mod(rotPx.y,dotSize)/dotSize;float thresh=1.0-brightness;alpha=1.0-step(thresh,lx)*step(thresh,ly);}vec3 col=colorMode==1?color.rgb:dotColor;vec3 final=mix(bgSample.rgb,col,alpha);gl_FragColor=vec4(final,1.0);}`;

      if(ht.glbOnly){
        BABYLON.Effect.ShadersStore['halftoneCompositeFragmentShader']=htCompSrc;
        const rtt=new BABYLON.RenderTargetTexture('htRTT',{width:engine.getRenderWidth(),height:engine.getRenderHeight()},scene,false);
        ms.forEach(m=>{try{rtt.renderList.push(m)}catch(e){}});
        scene.customRenderTargets.push(rtt);
        const htPass=new BABYLON.PostProcess('halftone','halftoneComposite',['screenSize','dotSize','angle','contrast','dotColor','pattern','colorMode','bgColor'],['meshSampler'],1.0,cam);
        htPass.onApply=effect=>{
          effect.setFloat2('screenSize',htPass.width,htPass.height);
          effect.setFloat('dotSize',ht.size); effect.setFloat('angle',ht.angle); effect.setFloat('contrast',ht.contrast);
          effect.setFloat3('dotColor',ht.colorR,ht.colorG,ht.colorB);
          effect.setInt('pattern',ht.pattern); effect.setInt('colorMode',ht.colorMode);
          effect.setTexture('meshSampler',rtt);
          effect.setFloat3('bgColor',scene.clearColor.r,scene.clearColor.g,scene.clearColor.b);
        };
      } else {
        BABYLON.Effect.ShadersStore['halftoneFragmentShader']=htShaderSrc;
        const htPass=new BABYLON.PostProcess('halftone','halftone',['screenSize','dotSize','angle','contrast','dotColor','pattern','colorMode'],null,1.0,cam);
        htPass.onApply=effect=>{
          effect.setFloat2('screenSize',htPass.width,htPass.height);
          effect.setFloat('dotSize',ht.size); effect.setFloat('angle',ht.angle); effect.setFloat('contrast',ht.contrast);
          effect.setFloat3('dotColor',ht.colorR,ht.colorG,ht.colorB);
          effect.setInt('pattern',ht.pattern); effect.setInt('colorMode',ht.colorMode);
        };
      }
    }
    // Apply shadows if enabled
    const shKeyOn=p.get('shKey')==='1';
    const shFillOn=p.get('shFill')==='1';
    const shSelfOn=p.get('shSelf')==='1';
    const shGndOn=p.get('shGnd')==='1';
    const shInt=parseFloat(p.get('shInt')||0.5);
    const shBlur=parseFloat(p.get('shBlur')||2);
    const shH=parseFloat(p.get('shH')||0);
    const dark=1-shInt;

    let shGenKey=null, shGenFill=null;
    if(shKeyOn){
      shGenKey=new BABYLON.ShadowGenerator(1024,dir);
      shGenKey.useBlurExponentialShadowMap=true;
      shGenKey.blurKernel=shBlur; shGenKey.darkness=dark;
      ms.forEach(m=>{try{shGenKey.addShadowCaster(m,true);}catch(e){}});
    }
    if(shFillOn){
      shGenFill=new BABYLON.ShadowGenerator(1024,fill);
      shGenFill.useBlurExponentialShadowMap=true;
      shGenFill.blurKernel=shBlur; shGenFill.darkness=dark;
      ms.forEach(m=>{try{shGenFill.addShadowCaster(m,true);}catch(e){}});
    }
    if(shSelfOn) ms.forEach(m=>{try{m.receiveShadows=true;}catch(e){}});
    if(shGndOn&&(shKeyOn||shFillOn)){
      const bounds=scene.getWorldExtends();
      const sz=Math.max(bounds.max.x-bounds.min.x,bounds.max.z-bounds.min.z)*4;
      const gnd=BABYLON.MeshBuilder.CreateGround('sg',{width:sz,height:sz,subdivisions:1},scene);
      gnd.position.y=shH;
      gnd.receiveShadows=true;
      const mat=new BABYLON.ShadowOnlyMaterial('sgm',scene);
      mat.shadowColor=new BABYLON.Color3(0,0,0);
      mat.alpha=shInt;
      gnd.material=mat;
    }
    G('ld').classList.add('h');
  },null,(sc,msg)=>{
    console.error(msg);
    G('ld').classList.add('h');
    G('np').classList.add('v');
  });

  G('bCV').addEventListener('click',restoreCreatorView);
  engine.runRenderLoop(()=>scene.render());
  window.addEventListener('resize',()=>engine.resize());
}

init();
</script>
</body>
</html>
